basePath: /api
definitions:
  handler.CreateMenuRequest:
    properties:
      name:
        example: System Code
        maxLength: 100
        type: string
      parent_id:
        example: 8af03526-7a4b-4c6b-8cfd-90c05d0f0ad1
        type: string
    required:
    - name
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: menu not found
        type: string
    type: object
  handler.MoveMenuRequest:
    properties:
      parent_id:
        example: 8af03526-7a4b-4c6b-8cfd-90c05d0f0ad1
        type: string
      position:
        example: 1
        minimum: 0
        type: integer
    required:
    - position
    type: object
  handler.ReorderMenuRequest:
    properties:
      position:
        example: 1
        minimum: 0
        type: integer
    required:
    - position
    type: object
  handler.ReorderMenusRequest:
    properties:
      menu_ids:
        example:
        - 8af03526-7a4b-4c6b-8cfd-90c05d0f0ad1
        - 9465f973-2aa8-473d-b391-9b3027f2a2bb
        items:
          type: string
        type: array
      parent_id:
        example: 8af03526-7a4b-4c6b-8cfd-90c05d0f0ad1
        type: string
    required:
    - menu_ids
    type: object
  handler.UpdateMenuRequest:
    properties:
      name:
        example: System Code
        maxLength: 100
        type: string
    required:
    - name
    type: object
  model.Menu:
    properties:
      created_at:
        type: string
      depth:
        type: integer
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      position:
        type: integer
      updated_at:
        type: string
    type: object
  model.MenuNode:
    properties:
      children:
        items:
          $ref: '#/definitions/model.MenuNode'
        type: array
      created_at:
        type: string
      depth:
        type: integer
      id:
        type: string
      name:
        type: string
      parent_id:
        type: string
      position:
        type: integer
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API untuk mengelola menu bertingkat (tree) dengan kedalaman tak terbatas
  title: Menu Tree API
  version: "1.0"
paths:
  /menus:
    get:
      description: Mengembalikan seluruh menu dalam struktur tree
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.MenuNode'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get menu tree
      tags:
      - menus
    post:
      consumes:
      - application/json
      description: Buat menu baru. Kosongkan parent_id untuk menu root
      parameters:
      - description: Menu baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateMenuRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Menu'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Create menu
      tags:
      - menus
  /menus/{id}:
    delete:
      description: Menghapus menu beserta seluruh anaknya
      parameters:
      - description: Menu ID (UUID)
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Delete menu
      tags:
      - menus
    get:
      parameters:
      - description: Menu ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Menu'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Get single menu
      tags:
      - menus
    put:
      consumes:
      - application/json
      parameters:
      - description: Menu ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Nama baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Menu'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Update menu name
      tags:
      - menus
  /menus/{id}/move:
    patch:
      consumes:
      - application/json
      description: Pindahkan menu ke parent baru. position adalah indeks sibling berbasis
        0; parent_id null untuk root.
      parameters:
      - description: Menu ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Parent dan posisi tujuan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.MoveMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Menu'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Move menu
      tags:
      - menus
  /menus/{id}/reorder:
    patch:
      consumes:
      - application/json
      description: Mengubah posisi menu di antara sibling pada parent yang sama.
      parameters:
      - description: Menu ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Posisi baru berbasis 0
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ReorderMenuRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Menu'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Reorder menu within its level
      tags:
      - menus
  /menus/reorder:
    put:
      consumes:
      - application/json
      description: Atur ulang seluruh sibling dengan urutan ID yang diberikan; semua
        sibling harus dicantumkan tepat sekali. parent_id null untuk root.
      parameters:
      - description: Parent dan urutan semua sibling
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.ReorderMenusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Reorder sibling menus
      tags:
      - menus
swagger: "2.0"
